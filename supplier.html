
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetBites - Supplier Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #F5F5F5;
            color: #333;
        }

        .navbar {
            background: white;
            padding: 12px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #EEE;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: #6E2C4A;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 700;
            color: #4A1F33;
        }

        .brand-sub {
            font-size: 10.5px;
            color: #999;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #6E2C4A;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }

        .user-info {
            text-align: right;
            font-size: 12px;
            line-height: 1.5;
        }

        .user-info .role {
            font-weight: 600;
        }

        .user-info .name {
            color: #999;
        }

        .dashboard {
            display: flex;
            min-height: calc(100vh - 63px);
        }

        .sidebar {
            width: 190px;
            background: white;
            border-right: 1px solid #EEE;
            padding: 22px 0;
            flex-shrink: 0;
        }

        .sidebar a {
            display: block;
            padding: 12px 22px;
            font-size: 13.5px;
            color: #666;
            text-decoration: none;
            border-left: 3px solid transparent;
        }

        .sidebar a:hover {
            background: #FAF5F7;
        }

        .sidebar a.active {
            color: #4A1F33;
            font-weight: 600;
            border-left-color: #6E2C4A;
            background: #F7F0F3;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 26px 32px 40px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .page-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #4A1F33;
            margin-bottom: 5px;
        }

        .page-header p {
            font-size: 12.5px;
            color: #999;
        }

        .add-button {
            background: #6E2C4A;
            color: white;
            padding: 11px 16px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .add-button:hover {
            background: #5A2139;
        }

        .summary {
            background: white;
            border: 1px solid #EEE;
            border-radius: 10px;
            padding: 18px 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .summary-label {
            color: #777;
            font-size: 13px;
        }

        .summary-count {
            color: #4A1F33;
            font-size: 25px;
            font-weight: 700;
            margin-top: 5px;
        }

        .search-section {
            position: relative;
            margin-bottom: 22px;
        }

        .search-section input {
            width: 100%;
            padding: 13px 44px 13px 15px;
            border: 1px solid #E5E5E5;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            outline: none;
        }

        .search-section input:focus {
            border-color: #6E2C4A;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .supplier-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .supplier-card {
            background: white;
            border: 1px solid #EEE;
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            min-width: 0;
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 20px;
            border-bottom: 1px solid #EEE;
        }

        .supplier-avatar {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #F7EEF2;
            color: #6E2C4A;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .supplier-title {
            min-width: 0;
            flex: 1;
        }

        .supplier-title h3 {
            font-size: 20px;
            color: #4A1F33;
            overflow-wrap: anywhere;
            margin-bottom: 8px;
        }

        .supplier-label {
            font-size: 14px;
            color: #999;
        }

        .status {
            font-size: 12px;
            font-weight: 700;
            padding: 9px 15px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .status.active {
            background: #E1F5E8;
            color: #168044;
        }

        .status.inactive {
            background: #FDE7E7;
            color: #C62828;
        }

        .supplier-details {
            padding: 20px 0;
        }

        .detail {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
        }

        .detail:last-child {
            margin-bottom: 0;
        }

        .detail-icon {
            width: 30px;
            flex-shrink: 0;
            font-size: 19px;
            text-align: center;
        }

        .detail-content {
            min-width: 0;
        }

        .detail small {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 7px;
        }

        .detail p {
            font-size: 16px;
            color: #222;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            padding-top: 22px;
            border-top: 1px solid #EEE;
        }

        .edit-button,
        .delete-button {
            flex: 1;
            text-align: center;
            padding: 13px 10px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .edit-button {
            background: #EEE3E8;
            color: #6E2C4A;
        }

        .edit-button:hover {
            background: #E5D3DC;
        }

        .delete-button {
            background: #FDE8E6;
            color: #E02020;
        }

        .delete-button:hover {
            background: #FAD5D2;
        }

        .empty-state {
            grid-column: 1 / -1;
            background: white;
            border: 1px solid #EEE;
            border-radius: 12px;
            text-align: center;
            padding: 45px 20px;
            color: #888;
        }

        .empty-state h3 {
            color: #4A1F33;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 18px;
        }

        @media (max-width: 900px) {
            .sidebar {
                display: none;
            }

            .main-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 12px 15px;
            }

            .user-info {
                display: none;
            }

            .main-content {
                padding: 15px;
            }

            .supplier-grid {
                grid-template-columns: 1fr;
            }

            .supplier-card {
                padding: 20px;
            }

            .card-top {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- TOP NAVIGATION -->
    <header class="navbar">
        <div class="brand">
            <div class="logo-box">🎂</div>
            <div>
                <div class="brand-name">SweetBites</div>
                <div class="brand-sub">Inventory System</div>
            </div>
        </div>

        <div class="user">
            <div class="avatar">A</div>
            <div class="user-info">
                <div class="role">Administrator</div>
                <div class="name">Admin</div>
            </div>
        </div>
    </header>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <nav>
                <a href="admin_dashboard.html">Dashboard</a>
                <a href="admin_ingredient.html">Ingredient Stock</a>
                <a href="supplier.html" class="active">Supplier</a>
                <a href="admin_purchase_orders.html">Purchasing Order</a>
                <a href="admin_catalog.html">Product Catalog</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <div class="page-header">
                <div>
                    <h2>Supplier List</h2>
                    <p>View and manage registered suppliers.</p>
                </div>

                <a href="add_supplier.html" class="add-button">
                    + Add New Supplier
                </a>
            </div>

            <div class="summary">
                <div>
                    <div class="summary-label">Total Registered Suppliers</div>
                    <div class="summary-count" id="supplierCount">0</div>
                </div>
                <div>🏪</div>
            </div>

            <!-- SEARCH -->
            <div class="search-section">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search supplier name, contact, phone or email..."
                    aria-label="Search suppliers"
                >
                <span class="search-icon">🔍</span>
            </div>

            <!-- SUPPLIER CARDS -->
            <div class="supplier-grid" id="supplierGrid"></div>

        </main>
    </div>

    <script>
        const STORAGE_KEY = "sweetBitesSuppliers";
        const LEGACY_KEY = "sweetBitesSupplier";

        const supplierGrid = document.getElementById("supplierGrid");
        const supplierCount = document.getElementById("supplierCount");
        const searchInput = document.getElementById("searchInput");

        function createId() {
            return "supplier-" +
                Date.now().toString(36) + "-" +
                Math.random().toString(36).slice(2, 9);
        }

        function loadSuppliers() {
            let suppliers = [];

            try {
                const stored = JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "[]"
                );

                if (Array.isArray(stored)) {
                    suppliers = stored;
                }
            } catch (error) {
                console.error("Unable to load suppliers:", error);
            }

            // Migrate an older single-supplier record without replacing the list.
            try {
                const oldRecord = localStorage.getItem(LEGACY_KEY);

                if (oldRecord) {
                    const legacy = JSON.parse(oldRecord);

                    if (legacy && typeof legacy === "object") {
                        const legacyName = (legacy.name || "").trim();

                        const exists = suppliers.some(
                            s => String(s.id) === String(legacy.id) ||
                                 (legacyName &&
                                  (s.name || "").trim().toLowerCase() ===
                                  legacyName.toLowerCase())
                        );

                        if (!exists) {
                            suppliers.push({
                                ...legacy,
                                id: legacy.id || createId()
                            });
                        }

                        localStorage.setItem(
                            STORAGE_KEY,
                            JSON.stringify(suppliers)
                        );

                        localStorage.removeItem(LEGACY_KEY);
                    }
                }
            } catch (error) {
                console.error("Unable to migrate old supplier:", error);
            }

            // Give older records an ID so their Edit links work.
            let changed = false;

            suppliers = suppliers.map(supplier => {
                if (!supplier.id) {
                    changed = true;
                    return { ...supplier, id: createId() };
                }
                return supplier;
            });

            if (changed) {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(suppliers)
                );
            }

            return suppliers;
        }

        let suppliers = loadSuppliers();

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        function renderSuppliers() {
            const searchText = searchInput.value.trim().toLowerCase();

            const filtered = suppliers.filter(supplier => {
                const searchableText = [
                    supplier.name,
                    supplier.contact,
                    supplier.phone,
                    supplier.email,
                    supplier.address,
                    supplier.status
                ].join(" ").toLowerCase();

                return searchableText.includes(searchText);
            });

            supplierCount.textContent = suppliers.length;
            supplierGrid.innerHTML = "";

            if (filtered.length === 0) {
                supplierGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>${suppliers.length === 0
                            ? "No Suppliers Yet"
                            : "No Matching Suppliers"}</h3>
                        <p>${suppliers.length === 0
                            ? "Add your first supplier to get started."
                            : "Try another search term."}</p>
                        ${suppliers.length === 0
                            ? '<a href="add_supplier.html" class="add-button">+ Add New Supplier</a>'
                            : ""}
                    </div>
                `;
                return;
            }

            filtered.forEach(supplier => {
                const id = String(supplier.id);
                const name = supplier.name || "Unnamed Supplier";
                const status = supplier.status || "Active";
                const isActive = status.toLowerCase() === "active";

                const card = document.createElement("article");
                card.className = "supplier-card";

                card.innerHTML = `
                    <div class="card-top">
                        <div class="supplier-avatar">
                            ${escapeHTML(name.trim().charAt(0).toUpperCase() || "S")}
                        </div>

                        <div class="supplier-title">
                            <h3>${escapeHTML(name)}</h3>
                            <span class="supplier-label">Supplier</span>
                        </div>

                        <span class="status ${isActive ? "active" : "inactive"}">
                            ${escapeHTML(status)}
                        </span>
                    </div>

                    <div class="supplier-details">
                        <div class="detail">
                            <div class="detail-icon">👤</div>
                            <div class="detail-content">
                                <small>Contact Person</small>
                                <p>${escapeHTML(supplier.contact || "Not provided")}</p>
                            </div>
                        </div>

                        <div class="detail">
                            <div class="detail-icon">📞</div>
                            <div class="detail-content">
                                <small>Phone Number</small>
                                <p>${escapeHTML(supplier.phone || "Not provided")}</p>
                            </div>
                        </div>

                        <div class="detail">
                            <div class="detail-icon">✉️</div>
                            <div class="detail-content">
                                <small>Email Address</small>
                                <p>${escapeHTML(supplier.email || "Not provided")}</p>
                            </div>
                        </div>

                        <div class="detail">
                            <div class="detail-icon">📍</div>
                            <div class="detail-content">
                                <small>Address</small>
                                <p>${escapeHTML(supplier.address || "Not provided")}</p>
                            </div>
                        </div>
                    </div>

                    <div class="card-actions">
                        <a class="edit-button"
                           href="edit_supplier.html?id=${encodeURIComponent(id)}">
                           Edit
                        </a>

                        <button class="delete-button" type="button">
                            Delete
                        </button>
                    </div>
                `;

                card.querySelector(".delete-button").addEventListener(
                    "click",
                    function () {
                        const confirmed = confirm(
                            `Are you sure you want to delete "${name}"?`
                        );

                        if (!confirmed) return;

                        suppliers = suppliers.filter(
                            item => String(item.id) !== id
                        );

                        try {
                            localStorage.setItem(
                                STORAGE_KEY,
                                JSON.stringify(suppliers)
                            );

                            renderSuppliers();
                        } catch (error) {
                            alert("Unable to delete supplier. Please try again.");
                            console.error(error);
                        }
                    }
                );

                supplierGrid.appendChild(card);
            });
        }

        searchInput.addEventListener("input", renderSuppliers);

        renderSuppliers();
    </script>

</body>
</html>
