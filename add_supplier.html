
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetBites - Add Supplier</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #F5F5F5;
            color: #333;
        }

        .navbar {
            background: white;
            padding: 12px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #EEE;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: #6E2C4A;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: #4A1F33;
        }

        .brand-sub {
            font-size: 12px;
            color: #999;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6E2C4A;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-info {
            text-align: right;
            font-size: 13px;
        }

        .user-info p {
            color: #999;
        }

        .dashboard {
            display: flex;
            min-height: calc(100vh - 67px);
        }

        .sidebar {
            width: 210px;
            background: white;
            border-right: 1px solid #EEE;
            padding: 22px 0;
            flex-shrink: 0;
        }

        .sidebar a {
            display: block;
            padding: 13px 22px;
            font-size: 13.5px;
            color: #666;
            text-decoration: none;
            border-left: 3px solid transparent;
        }

        .sidebar a:hover,
        .sidebar a.active {
            color: #4A1F33;
            font-weight: 600;
            border-left-color: #6E2C4A;
            background: #F7F0F3;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h2 {
            font-size: 27px;
            color: #4A1F33;
            margin-bottom: 6px;
        }

        .page-header p {
            font-size: 14px;
            color: #999;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #EEE;
            padding: 28px;
            max-width: 760px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }

        .required {
            color: #6E2C4A;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #DDD;
            border-radius: 8px;
            font-size: 14px;
            background: #FAFAFA;
            color: #333;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6E2C4A;
            background: white;
            box-shadow: 0 0 0 3px rgba(110,44,74,0.1);
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid #EEE;
            margin-top: 25px;
        }

        .cancel-button,
        .save-button {
            padding: 12px 22px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .cancel-button {
            background: white;
            color: #666;
            border: 1px solid #DDD;
        }

        .save-button {
            background: #6E2C4A;
            color: white;
            border: none;
        }

        .save-button:hover {
            background: #5A2139;
        }

        @media (max-width: 800px) {
            .sidebar {
                display: none;
            }

            .main-content {
                padding: 20px;
            }

            .form-card {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .user-info {
                display: none;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .cancel-button,
            .save-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="brand">
            <div class="logo-box">🎂</div>
            <div>
                <div class="brand-name">SweetBites</div>
                <div class="brand-sub">Inventory System</div>
            </div>
        </div>

        <div class="user">
            <div class="avatar">A</div>
            <div class="user-info">
                <strong>Administrator</strong>
                <p>Admin</p>
            </div>
        </div>
    </header>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <nav>
                <a href="admin_dashboard.html">Dashboard</a>
                <a href="admin_ingredient.html">Ingredient Stock</a>
                <a href="supplier.html" class="active">Supplier</a>
                <a href="admin_purchase_orders.html">Purchasing Order</a>
                <a href="admin_catalog.html">Product Catalog</a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="main-content">

            <div class="page-header">
                <h2>Supplier Information</h2>
                <p>Enter the details of the new supplier below.</p>
            </div>

            <div class="form-card">

                <form id="addSupplierForm">

                    <div class="form-group">
                        <label for="supplier_name">
                            Supplier Name <span class="required">*</span>
                        </label>
                        <input
                            type="text"
                            id="supplier_name"
                            maxlength="100"
                            placeholder="Enter supplier name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="contact_person">Contact Person</label>
                        <input
                            type="text"
                            id="contact_person"
                            maxlength="100"
                            placeholder="Enter contact person"
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            maxlength="20"
                            placeholder="Enter phone number"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            maxlength="100"
                            placeholder="Enter email address"
                        >
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea
                            id="address"
                            rows="4"
                            placeholder="Enter supplier address"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="status">Supplier Status</label>
                        <select id="status">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <a href="supplier.html" class="cancel-button">
                            Cancel
                        </a>

                        <button type="submit" class="save-button">
                            Add Supplier
                        </button>
                    </div>

                </form>
            </div>

        </main>
    </div>

    <script>
        const STORAGE_KEY = "sweetBitesSuppliers";

        document.getElementById("addSupplierForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const supplier = {
                    id: Date.now().toString(),
                    name: document.getElementById("supplier_name").value.trim(),
                    contact: document.getElementById("contact_person").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    address: document.getElementById("address").value.trim(),
                    status: document.getElementById("status").value
                };

                if (!supplier.name) {
                    alert("Please enter a supplier name.");
                    return;
                }

                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    let suppliers = saved ? JSON.parse(saved) : [];

                    if (!Array.isArray(suppliers)) {
                        suppliers = [];
                    }

                    suppliers.push(supplier);

                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(suppliers)
                    );

                    alert("Supplier added successfully!");

                    window.location.href = "supplier.html";

                } catch (error) {
                    alert("Unable to save supplier information.");
                }
            }
        );
    </script>

</body>
</html>
