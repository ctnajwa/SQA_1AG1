
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetBites | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff3f5;
    min-height: 100vh;
    color: #49353b;
}

.container {
    display: flex;
    min-height: 100vh;
    width: 100%;
}

/* LEFT BRANDING PANEL */

.left-panel {
    width: 50%;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;

    background-color: #f8dce3;
    background-image:
        linear-gradient(rgba(255,255,255,.35) 50%, transparent 50%),
        linear-gradient(90deg, rgba(255,255,255,.35) 50%, transparent 50%);
    background-size: 70px 70px;
}

.brand {
    position: relative;
    z-index: 2;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(40px, 5vw, 70px);
    font-weight: bold;
    letter-spacing: -3px;
    color: #a63e59;
    text-shadow: 2px 3px 0 white;
    white-space: nowrap;
}

.brand-heart {
    position: absolute;
    top: -22px;
    right: -20px;
    font-size: 30px;
    color: #c65b78;
}

.tagline {
    position: relative;
    z-index: 2;
    margin-top: 18px;
    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 3px;
    color: #96516a;
}

.dessert-area {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 20px;
    margin-top: 85px;
}

.cake-slice {
    position: relative;
    width: 95px;
    height: 100px;
    margin-bottom: 12px;
    border: 2px solid #b66d71;
    border-radius: 5px;
    background: linear-gradient(
        to bottom,
        #fff0df 0%, #fff0df 25%,
        #e99aaa 25%, #e99aaa 42%,
        #fff0df 42%, #fff0df 68%,
        #e99aaa 68%, #e99aaa 83%,
        #fff0df 83%
    );
    transform: skewY(-3deg);
}

.cake-slice::before {
    content: "";
    position: absolute;
    top: -9px;
    left: -2px;
    right: -2px;
    height: 17px;
    background: #fff8ed;
    border: 2px solid #b66d71;
    border-radius: 50%;
}

.cake-slice::after {
    content: "♥";
    position: absolute;
    top: -30px;
    left: 35px;
    font-size: 20px;
    color: #c14f68;
}

.cupcake {
    position: relative;
    width: 95px;
    height: 120px;
}

.cupcake-cream {
    position: absolute;
    top: 5px;
    left: 5px;
    width: 85px;
    height: 53px;
    background: #fff7ee;
    border: 2px solid #b66d71;
    border-radius: 45% 45% 30% 30%;
}

.cupcake-cream::before {
    content: "";
    position: absolute;
    top: -13px;
    left: 18px;
    width: 42px;
    height: 27px;
    background: #fff7ee;
    border: 2px solid #b66d71;
    border-radius: 50%;
}

.cupcake-cream::after {
    content: "♥";
    position: absolute;
    top: 12px;
    left: 32px;
    font-size: 17px;
    color: #cc607d;
}

.cupcake-base {
    position: absolute;
    top: 48px;
    left: 14px;
    width: 67px;
    height: 62px;
    background: repeating-linear-gradient(
        90deg,
        #e9a2a9 0, #e9a2a9 12px,
        #f8d2c9 12px, #f8d2c9 22px
    );
    border: 2px solid #b66d71;
    border-radius: 3px 3px 15px 15px;
    clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
}

.small-cake {
    font-size: 62px;
    margin-bottom: 15px;
}

.decor {
    position: absolute;
    color: #c75d7b;
    opacity: .8;
    font-size: 35px;
}

.decor-one { top: 18%; left: 12%; }
.decor-two { top: 38%; right: 12%; }
.decor-three { bottom: 24%; left: 14%; }
.decor-four { bottom: 28%; right: 13%; }

.bottom-wave {
    position: absolute;
    bottom: -75px;
    left: -10%;
    width: 120%;
    height: 135px;
    background: #dc8ba2;
    border-top: 8px solid #f3b7c8;
    border-radius: 50% 50% 0 0;
    transform: rotate(-4deg);
}

/* RIGHT LOGIN PANEL */

.right-panel {
    width: 50%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    background: #fffafa;
}

.login-card {
    width: 100%;
    max-width: 600px;
    padding: 40px;
    background: #fffdfd;
    border: 1px solid #f7dce3;
    border-radius: 23px;
    box-shadow: 0 10px 35px rgba(153,62,91,.08);
}

.login-card h1 {
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(32px, 3.2vw, 45px);
    color: #a83e5d;
    margin-bottom: 12px;
}

.subtitle {
    text-align: center;
    font-size: 17px;
    color: #94848a;
    margin-bottom: 32px;
}

/* ADMIN / USER SELECTION */

.role-options {
    display: flex;
    gap: 15px;
    margin-bottom: 28px;
}

.role-button {
    flex: 1;
    min-height: 105px;
    background: white;
    border: 1px solid #e8dfe2;
    border-radius: 13px;
    color: #65575b;
    cursor: pointer;
    transition: .2s;
}

.role-button:hover {
    border-color: #bd496b;
}

.role-button.active {
    background: #fce8ee;
    border: 1.5px solid #bd496b;
    color: #a83e5d;
}

.role-icon {
    display: block;
    font-size: 29px;
    margin-bottom: 10px;
}

.role-button strong {
    font-size: 17px;
}

/* FORM FIELDS */

.form-group {
    margin-bottom: 23px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #59454b;
    margin-bottom: 9px;
}

.input-box {
    display: flex;
    align-items: center;
    width: 100%;
    overflow: hidden;
    border: 1px solid #f0d9df;
    border-radius: 11px;
    background: #fffafa;
}

.input-box:focus-within {
    border-color: #bd496b;
    box-shadow: 0 0 0 3px #fce8ee;
}

.input-icon {
    width: 58px;
    min-width: 58px;
    padding: 16px 0;
    text-align: center;
    font-size: 20px;
    color: #b74667;
    background: #fff0f4;
}

.input-box input {
    width: 100%;
    min-width: 0;
    padding: 17px 15px;
    border: none;
    outline: none;
    background: transparent;
    color: #49353b;
    font-size: 15px;
}

.input-box input::placeholder {
    color: #a39499;
}

.password-toggle {
    padding: 12px;
    border: none;
    background: transparent;
    color: #b74667;
    cursor: pointer;
    font-size: 18px;
}

/* FORM OPTIONS */

.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 4px 0 28px;
    font-size: 14px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #716168;
    cursor: pointer;
}

.remember input {
    width: 16px;
    height: 16px;
    accent-color: #b74667;
}

.forgot {
    color: #b74667;
    text-decoration: none;
}

.forgot:hover {
    text-decoration: underline;
}

/* LOGIN BUTTON */

.login-button {
    width: 100%;
    padding: 19px;
    border: none;
    border-radius: 12px;
    background: #b74667;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.login-button:hover {
    background: #983650;
}

.message {
    margin-top: 15px;
    text-align: center;
    color: #a83e5d;
    font-size: 14px;
    line-height: 1.5;
}

.footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: #a18c92;
}

/* RESPONSIVE DESIGN */

@media (max-width: 900px) {
    .container {
        flex-direction: column;
    }

    .left-panel,
    .right-panel {
        width: 100%;
        min-height: auto;
    }

    .left-panel {
        padding: 65px 20px;
    }

    .brand {
        font-size: clamp(40px, 9vw, 65px);
    }

    .dessert-area {
        margin-top: 60px;
    }

    .right-panel {
        padding: 25px 15px;
    }

    .login-card {
        max-width: 550px;
        padding: 30px 22px;
    }
}

@media (max-width: 420px) {
    .role-options {
        gap: 9px;
    }

    .role-button {
        min-height: 90px;
    }

    .form-options {
        font-size: 12px;
    }

    .input-box input {
        padding: 15px 10px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT: SWEETBITES BRANDING -->

    <section class="left-panel">

        <span class="decor decor-one">♡</span>
        <span class="decor decor-two">♡</span>
        <span class="decor decor-three">♡</span>
        <span class="decor decor-four">✧</span>

        <div class="brand">
            SweetBites
            <span class="brand-heart">♡</span>
        </div>

        <p class="tagline">BAKED WITH LOVE</p>

        <div class="dessert-area">
            <div class="dessert">
                <div class="cake-slice"></div>
            </div>

            <div class="dessert">
                <div class="cupcake">
                    <div class="cupcake-cream"></div>
                    <div class="cupcake-base"></div>
                </div>
            </div>

            <div class="dessert small-cake">🍒</div>
        </div>

        <div class="bottom-wave"></div>

    </section>

    <!-- RIGHT: LOGIN FORM -->

    <section class="right-panel">

        <div class="login-card">

            <h1>Welcome Back!</h1>
            <p class="subtitle">Log in to your account</p>

            <div class="role-options">

                <button type="button"
                        class="role-button active"
                        data-role="Admin"
                        aria-pressed="true">
                    <span class="role-icon">⚙</span>
                    <strong>Admin</strong>
                </button>

                <button type="button"
                        class="role-button"
                        data-role="User"
                        aria-pressed="false">
                    <span class="role-icon">♙</span>
                    <strong>User</strong>
                </button>

            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <div class="input-box">
                        <span class="input-icon">♟</span>

                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="Username"
                               autocomplete="username"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <span class="input-icon">♙</span>

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Password"
                               autocomplete="current-password"
                               required>

                        <button type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password">◎</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#" class="forgot" id="forgotPassword">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="login-button">
                    Log In
                </button>

                <p class="message" id="message" role="status"></p>

            </form>

            <div class="footer">
                SweetBites · Your bakery, organised
            </div>

        </div>

    </section>

</div>

<script>
// SELECT ADMIN OR USER

let selectedRole = "Admin";

const roleButtons = document.querySelectorAll(".role-button");

roleButtons.forEach(function(button) {
    button.addEventListener("click", function() {

        selectedRole = button.dataset.role;

        roleButtons.forEach(function(item) {
            item.classList.remove("active");
            item.setAttribute("aria-pressed", "false");
        });

        button.classList.add("active");
        button.setAttribute("aria-pressed", "true");

        document.getElementById("message").textContent = "";
    });
});

// SHOW OR HIDE PASSWORD

document.getElementById("togglePassword")
.addEventListener("click", function() {

    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
        this.textContent = "◉";
        this.setAttribute("aria-label", "Hide password");
    } else {
        password.type = "password";
        this.textContent = "◎";
        this.setAttribute("aria-label", "Show password");
    }
});

// DEMO LOGIN AND REDIRECTION

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if (
        selectedRole === "Admin" &&
        username === "admin" &&
        password === "Admin123"
    ) {
        window.location.href = "admin_dashboard.html";
    }
    else if (
        selectedRole === "User" &&
        username === "user" &&
        password === "User123"
    ) {
        window.location.href = "portal_catalog.html";
    }
    else {
        message.textContent =
            "Invalid username or password for the selected role.";
    }
});

// FORGOT PASSWORD

document.getElementById("forgotPassword")
.addEventListener("click", function(event) {

    event.preventDefault();

    document.getElementById("message").textContent =
        "Please contact the administrator to reset your password.";
});
</script>

</body>
</html>
