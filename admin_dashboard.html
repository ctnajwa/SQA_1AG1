<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - SweetBites</title>
<link rel="stylesheet" href="Style/admin_style.css">
<style>
  /* Dashboard specific metric cards layout */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
  }
  .metric-card {
    background-color: white;
    border: 1px solid #f0dfe3;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 3px 10px rgba(101, 52, 67, 0.06);
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .metric-icon {
    width: 50px;
    height: 50px;
    background-color: #fff0f3;
    color: #8f4962;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .metric-info h3 {
    margin: 0 0 5px;
    font-size: 22px;
    color: #71354c;
  }
  .metric-info p {
    margin: 0;
    color: #999;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
  }
  @media (max-width: 1100px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .metrics-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">🎂</div>
      <div>
        <h2>SweetBites</h2>
        <p>Inventory System</p>
      </div>
    </div>
    
    <nav>
      <a href="admin_dashboard.html" class="nav-item active">
        <span>📊</span> Dashboard
      </a>
      <a href="#" class="nav-item">
        <span>📦</span> Ingredient Stock
      </a>
      <a href="#" class="nav-item">
        <span>🚚</span> Supplier
      </a>
      <a href="#" class="nav-item">
        <span>📋</span> Purchasing Order
      </a>
      <a href="admin_catalog.html" class="nav-item">
        <span>🍰</span> Product Catalog
      </a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <div class="main-content">

    <!-- Top Bar -->
    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <p>Welcome back, Administrator</p>
      </div>
      <div class="admin-profile">
        <div class="profile-circle">A</div>
        <div>
          <strong>Administrator</strong>
          <small>Admin</small>
        </div>
      </div>
    </div>

    <!-- Page Content -->
    <div class="content">

      <!-- Metrics Overview -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-icon">🍰</div>
          <div class="metric-info">
            <h3>14</h3>
            <p>Total Products</p>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-icon">⚠️</div>
          <div class="metric-info">
            <h3>2</h3>
            <p>Low Stock Items</p>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-icon">🚚</div>
          <div class="metric-info">
            <h3>5</h3>
            <p>Active Suppliers</p>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-icon">📋</div>
          <div class="metric-info">
            <h3>3</h3>
            <p>Pending Orders</p>
          </div>
        </div>
      </div>

      

    </div>

  </div>

</div>

</body>
</html>
